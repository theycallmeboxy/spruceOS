#!/bin/sh
# GKD 350H Ultra (Rockchip RK3576S, 1440x1600 portrait panel shown landscape) on BasedOS
# (github.com/theycallmeboxy/BasedOS): a BaseOS-style base on the eMMC that runs spruce from the
# card. Detected by BASEOS_TARGET=gkd350hultra in /etc/baseos-release (helperFunctions.sh).
# BasedOS harvests the stock ROCKNIX userland: libmali Bifrost G52 (GBM/KMS, GLES only), the
# same GPU family as the dArkMoss RK3566 units, so this board takes dArkMossCommon's values first,
# then BasedOSCommon's (the base: library path, no udev, PyUI, firmware), then its own hardware.
# Hardware values are from the unit (BasedOS docs/recon.md, 2026-11-16).

. /mnt/SDCARD/spruce/scripts/platform/darkmoss/dArkMossCommon.cfg
. /mnt/SDCARD/spruce/scripts/platform/basedos/BasedOSCommon.cfg

  #################################
#####   IDENTITY AND FIRMWARE   #####
  #################################

export BRAND="GKD"
export SPRUCE_DEVICE_NAME="GKD 350H Ultra"
export SYSTEM_JSON="/mnt/SDCARD/Saves/gkd350hultra-system.json"
# No GKD system json ships in PyUI yet; the dArkMoss Pixel 2's has the same settings.
export SYSTEM_JSON_DEFAULT="/mnt/SDCARD/App/PyUI/main-ui/devices/darkmoss/json/pixel2-darkmoss-system.json"

  ###################################
#####   DISPLAY CHARACTERISTICS   #####
  ###################################

# The panel's only mode is 1440x1600 portrait, mounted landscape. As on dArkMoss's rotated panels
# (V10, Miniloong, E5 Plus), BasedOS's system SDL2 turns DSI output with the RGA (ROT_270), so
# SDL/KMSDRM clients see 1600x1440 at 0. PyUI uses its own SDL2 and turns its canvas itself
# (SCREEN_ROTATION, as the H700 cfg sets it).
export DISPLAY_WIDTH="1600"
export DISPLAY_HEIGHT="1440"
export DISPLAY_ROTATION="0"
export SCREEN_ROTATION="270"
# Screenshots grab the panel's scanout, 1440x1600 and turned: back 90 degrees clockwise
# (dArkMossCommon's take_screenshot).
export SCREENSHOT_FILTER="transpose=1"
# DSperate's KMS sink needs the window to be a panel mode, which the turned SDL isn't, and its
# next choice (the window surface) scales 1600x1440 on the CPU: 52-54 fps in Smart. Its SDL
# renderer (GLES, only DS-size textures uploaded) holds full speed: 59.8 fps with BasedOS's 60 Hz panel
# DTB, 59 on stock's 59.11 Hz (beebono/DSperate's own switch). That path ignores DS_ROTATE, so the
# NDS list here (Emulator_BASEDOS) leaves out DSperate-Tate.
export DS_SCANLINE_SCALE=0
export DISPLAY_ASPECT_RATIO="10:9"
export DISPLAY_TEXT_ELF_WIDTH="1500"

  ########################
#####   CPU SETTINGS   #####
  ########################

# Two clusters: policy0 = cpus 0-3 (A53, 408-2016 MHz), policy4 = cpus 4-7 (A72, 408-2208 MHz).
# OPPs: 408000 600000 816000 1008000 1200000 1416000 1608000 1800000 2016000 (+ 2208000 on A72).
# cpu_control_functions.sh writes one set of frequencies to both; each cluster clamps a request to
# its own range (2208 MHz asked: A53s 2016, A72s 2208; checked on the unit).
#
# The A72s in every mode, the A53s parked, as on the TrimUI Smart Pro S (spruce's 8-core
# big.LITTLE reference, which runs one cluster everywhere and keeps the other unit offline):
#   Powersave  conservative, 408-1416 MHz (the menu's screensaver). Every A72 step from 408 to
#              1416 runs at the regulator's 712.5 mV floor, so 1416 is the fastest clock at the
#              lowest voltage; a lower cap would only stretch the same work out.
#   Smart      conservative (spruce's set_smart on cpu4), 408-2016 MHz, with spruce's Smart tuning
#   Performance 2016 MHz
#   Overclock  2208 MHz, the top of the table the kernel picks for this chip (an RK3576S that its
#              fuses put on the standard RK3576 table: "bin=0 (3)" at boot)
# The A53s would do the light modes for a little less (1-3.5% of the total draw, about 12-32
# minutes of a full charge at a dim backlight: BasedOS docs/power.md), not enough to keep a
# second cluster in the modes. cpu0 is parked too (every IRQ moves to cpu4); spruce's writes to
# cpu0's cpufreq then fail harmlessly, as on the Smart Pro S.
export DEVICE_MIN_CORES_ONLINE=4567
export CPU_SMART_CORES_ONLINE=4567
export DEVICE_MAX_CORES_ONLINE=4567
export DEVICE_POWERSAVE_LOW_FREQ=408000
export DEVICE_POWERSAVE_HIGH_FREQ=1416000
export CPU_SMART_MIN_FREQ=408000
# Smart reaches Performance's top, as on the Smart Pro S (dArkMossCommon caps it at 1800).
unset CPU_SMART_MAX_FREQ
export CPU_PERF_MAX_FREQ=2016000
export CPU_OVERCLOCK_MAX_FREQ=2208000
# Per-policy governor tunables here: dArkMossCommon's is cpu0's, which is parked.
export CONSERVATIVE_POLICY_DIR=/sys/devices/system/cpu/cpufreq/policy4/conservative

# Mali-G52 at 300-900 MHz; the VOP stays on the kernel's governor.
export GPU_GOVENOR_DIR="/sys/class/devfreq/27800000.gpu"
export GPU_SMART_MAX_FREQ="900000000"
export GPU_PERFORMANCE_MAX_FREQ="900000000"
export GPU_OVERCLOCK_MAX_FREQ="900000000"

# The DDR follows the mode, as on the Flip and Miniloong: 528-2112 MHz, lowest step in
# Powersave, the kernel's dmc_ondemand in Smart, top step in Performance and Overclock.
export DRAM_DEVFREQ_DIR="/sys/class/devfreq/dmc"
export DRAM_MIN_FREQ="528000000"
export DRAM_MAX_FREQ="2112000000"
export DRAM_POWERSAVE_GOVERNOR="powersave"
export DRAM_SMART_GOVERNOR="dmc_ondemand"
export DRAM_PERFORMANCE_GOVERNOR="performance"
export DRAM_OVERCLOCK_GOVERNOR="performance"

  ##################################################
#####   OTHER HARDWARE FEATURES AND INTERFACES   #####
  ##################################################

export DEVICE_TEMP_SENSOR="/sys/devices/virtual/thermal/thermal_zone0/temp"
export DEVICE_NUM_ANALOG_STICKS=1
export DEVICE_SUPPORTS_PORTMASTER="true"
# ES9018K2M DAC: volume is its own "Digital" attenuator (0-255, 0.5 dB steps); there is no
# "Master" (stock's came from PipeWire) and no playback-path switch. dArkMossCommon's opt-in reads
# the level on the same mapped (-M) scale set_volume writes.
export VOLUME_CONTROL="Digital"
export DARKMOSS_VOLUME_READ_MAPPED=1
unset AUDIO_PATH_CONTROL
# AP6256 (BCM43456) on SDIO: BasedOS loads its driver at boot; Wi-Fi itself is spruce's
# (BasedOSCommon.sh).
export BASEDOS_WIFI_MODULE="bcmdhd"
# The 3566 build targets the A55 (ARMv8.2); the RK3576's A72/A53 are ARMv8.0, as the RK3326's A35.
export PSP_BIN="PPSSPPSDL_dArkMoss3326"
# The hym8563 RTC's alarm has minute resolution (sleep_functions.sh rounds wake alarms up to it).
export WAKE_ALARM_RESOLUTION=60

  ###########################
#####   PYUI ENV DEVICE   #####
  ###########################

# PyUI runs as the env-driven ENV_VAR device (BasedOSCommon.cfg).
export DEFAULT_CFG_PATH="$SYSTEM_JSON_DEFAULT"
export CONTROLLER_EVENT_FORMAT="llHHi"
export STICK_DEADZONE="300"

  ######################################
#####   KEY CODES AND INPUT EVENTS   #####
  ######################################

# BasedOS has no udev, so no by-path links (BasedOSCommon.cfg): resolve_pad_node finds the pad by
# its evdev name, and resolve_key_event_node finds the rk805 power key and the gpio-keys volume
# rocker by their capabilities. The values here are fallbacks.
export PAD_NAME_CANDIDATES="gkd_atom_joypad"
export EVENT_PATH_READ_INPUTS_SPRUCE="/dev/input/event3"
export EVENT_PATH_SEND_TO_RA_AND_PPSSPP="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_SEND_TO_DRASTIC="$EVENT_PATH_READ_INPUTS_SPRUCE"
export EVENT_PATH_POWER="/dev/input/event0"
export EVENT_PATH_VOLUME="/dev/input/event2"
export SPRUCE_INPUT_NODES_FILE="/tmp/gkd350hultra_input_nodes"
[ -f "$SPRUCE_INPUT_NODES_FILE" ] && . "$SPRUCE_INPUT_NODES_FILE"

# gkd_atom_joypad: the Pixel 2's gamekiddy-joypad codes, plus Menu, L3 and one stick.
export B_UP="1 544"
export B_DOWN="1 545"
export B_LEFT="1 546"
export B_RIGHT="1 547"

export B_A="1 305"    # BTN_EAST (printed A)
export B_B="1 304"    # BTN_SOUTH
export B_X="1 307"    # BTN_NORTH
export B_Y="1 308"    # BTN_WEST

export B_L1="1 310"
export B_R1="1 311"
export B_L2="1 312"   # digital
export B_R2="1 313"   # digital
export B_L3="1 317"   # stick click
export B_R3="DOESNT_EXIST"

export B_SELECT="1 314"
export B_START="1 315"
export B_MENU="1 316"  # BTN_MODE, the button printed "Menu"
export B_HOME="1 704"  # BTN_TRIGGER_HAPPY1, the button printed "Home"

# One stick on ABS_X/ABS_Y, reported -900..899; left and up are negative. Measured on the unit
# (2026-11-16): X -726..658, Y -780..754, every pad code above as listed, and all buttons
# working in spruce's gamepad tester.
export STICK_LEFT="3 0 -900"
export STICK_RIGHT="3 0 900"
export STICK_UP="3 1 -900"
export STICK_DOWN="3 1 900"

# SDL game controller mapping, by printed label as on the other units (a = printed A, x = printed
# X); export_sdl_gamecontroller_map's "positional" swaps a/b and x/y for emulators that bind by
# position (DSperate). Without it SDL guessed this pad from its codes and DSperate's X and Y came
# out swapped. GUID: bus 0x19, vendor 0x0001, product 0x2103, version 0x0100 (as the Pixel 2's
# pixel2_joypad, product 0x2102). SDL numbers the buttons in code order as joydev does:
# 304 b0, 305 b1, 307 b2, 308 b3, 310-313 b4-b7, 314 b8, 315 b9, 316 b10, 317 b11,
# 544-547 b12-b15, 704 b16.
export SDL_GAMECONTROLLER_MAP="19000000010000000321000000010000,gkd_atom_joypad,a:b1,b:b0,x:b2,y:b3,back:b8,guide:b10,start:b9,leftshoulder:b4,rightshoulder:b5,lefttrigger:b6,righttrigger:b7,leftstick:b11,dpup:b12,dpdown:b13,dpleft:b14,dpright:b15,leftx:a0,lefty:a1,platform:Linux,"
# Flycast standalone takes its pad map from Emu/DC/default_configs/flycast/pads/<this> (install_flycast_pad_mapping)
export FLYCAST_PAD_MAP="GKD350HUltra"
export SATURN_PAD_TABLE="GKD350HUltra"   # the Saturn standalone's pad seed, Emu/SATURN/pad/keymap-GKD350HUltra.json
export STICK_LEFT_2="DOESNT_EXIST"
export STICK_RIGHT_2="DOESNT_EXIST"
export STICK_UP_2="DOESNT_EXIST"
export STICK_DOWN_2="DOESNT_EXIST"

  ###############
#####   HDMI   #####
  ###############

export HDMI_STATE_PATH=""
export HEADPHONE_STATE_PATH=""

  ##############################
#####   BRIGHTNESS MAPPING   #####
  ##############################

# 256 pwm-backlight levels (stock left it at 140).
export SYSTEM_BACKLIGHT_LEVEL_0="5"
export SYSTEM_BACKLIGHT_LEVEL_1="25"
export SYSTEM_BACKLIGHT_LEVEL_2="50"
export SYSTEM_BACKLIGHT_LEVEL_3="75"
export SYSTEM_BACKLIGHT_LEVEL_4="100"
export SYSTEM_BACKLIGHT_LEVEL_5="125"
export SYSTEM_BACKLIGHT_LEVEL_6="150"
export SYSTEM_BACKLIGHT_LEVEL_7="175"
export SYSTEM_BACKLIGHT_LEVEL_8="200"
export SYSTEM_BACKLIGHT_LEVEL_9="225"
export SYSTEM_BACKLIGHT_LEVEL_10="255"

  #########################
#####   RetroArch Keys   #####
  #########################

# The pad's button numbers in RetroArch (linuxraw, code order as set_default_ra_hotkeys uses them):
# Select 8, Start 9, Home (BTN_TRIGGER_HAPPY1) 16; 10 is Menu.
RA_HOTKEY_LINE="input_enable_hotkey_btn"
RA_SELECT_VAL="8"
RA_START_VAL="9"
RA_HOME_VAL="16"
