#!/bin/sh
# BasedOS, the base every basedos/ board shares (see BasedOSCommon.sh). A board's cfg sources this
# first, then sets its own hardware values.

# Offline, spruce's BaseOS updater compares the installed BasedOS with this (baseos_fw_needs_update).
export TARGET_BASEOS_VERSION="0.0.1"

# Everything BasedOS takes from a board's stock firmware sits in /usr/lib (no multiarch dir). The
# base goes first: its GPU stack (and what it loads) must not pick up flip/lib's older copies (see
# App/PyUI/launch.sh); flip/lib fills in what the base lacks.
export PATH=/mnt/SDCARD/spruce/scripts/bin:/mnt/SDCARD/spruce/bin64:/usr/bin:/usr/sbin:/bin:/sbin:/mnt/SDCARD/spruce/flip/bin
export LD_LIBRARY_PATH="/usr/lib:/lib:/mnt/SDCARD/spruce/flip/lib"
# Only the aarch64 loader: no 32-bit RetroArch or cores.
export DEVICE_HAS_32_BIT_RA="false"
# No udev daemon: SDL programs scan /dev/input themselves, and there are no by-path links, so
# resolve_pad_node finds the pad by its evdev name (the board's PAD_NAME_CANDIDATES).
export SDL_JOYSTICK_DISABLE_UDEV=1
export PAD_NODE_CANDIDATES=""

# PyUI has no device of its own for a BasedOS board: it runs as the env-driven ENV_VAR device
# (App/PyUI/spruce-device-env.sh). BusyBox's poweroff and reboot (BasedOS's rcK runs on both).
export PYUI_ENV_DEVICE="true"
export POWER_OFF_CMD="poweroff"
export REBOOT_CMD="reboot"

# PortMaster's GUI (pysdl2, which searches these in order): SDL2 itself is BasedOS's, which turns a
# rotated panel and finds gptokeyb's keyboard without udev; SDL2_mixer, which BasedOS doesn't
# carry, is PortMaster's own (spruce/portmaster/portmaster.txt).
export DEVICE_PYSDL2_DLL_PATH="/usr/lib:/mnt/SDCARD/Persistent/portmaster/lib"
