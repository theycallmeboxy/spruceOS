; Pad map for the GKD 350H Ultra (gkd_atom_joypad), from GKD350HUltra.cfg's SDL map made positional (as
; run_flycast_standalone exports it): Dreamcast A/B/X/Y on the south/east/west/north buttons, L1/R1 as Z/C,
; L2/R2 as the triggers. The d-pad is buttons 12-15, not a hat.
[analog]
bind0 = 0-:btn_analog_left
bind1 = 0+:btn_analog_right
bind2 = 1-:btn_analog_up
bind3 = 1+:btn_analog_down

[digital]
bind0 = 0:btn_a
bind1 = 1:btn_b
bind2 = 3:btn_x
bind3 = 2:btn_y
bind4 = 9:btn_start
bind5 = 10:btn_menu
bind6 = 4:btn_z
bind7 = 5:btn_c
bind8 = 6:btn_trigger_left
bind9 = 7:btn_trigger_right
bind10 = 12:btn_dpad1_up
bind11 = 13:btn_dpad1_down
bind12 = 14:btn_dpad1_left
bind13 = 15:btn_dpad1_right

[emulator]
dead_zone = 10
mapping_name = spruce GKD350HUltra
rumble_power = 100
saturation = 100
version = 3
