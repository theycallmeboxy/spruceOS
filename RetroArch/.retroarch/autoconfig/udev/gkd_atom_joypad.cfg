# GKD 350H Ultra internal pad (gkd_atom_joypad, the gamekiddy-joypad driver; BUS_HOST 0x0001:0x2103).
# RetroArch's udev driver numbers keys from BTN_JOYSTICK up in code order: 304 B 0, 305 A 1,
# 307 X 2, 308 Y 3, 310-313 L1 R1 L2 R2 4-7, 314 Select 8, 315 Start 9, 316 Menu 10, 317 L3 11,
# 544-547 D-pad 12-15, 704 Home 16. One stick on ABS_X/ABS_Y (left and up are negative).
# Codes measured on the unit (2026-11-16); the index order follows the driver's rule above.
input_driver = "udev"
input_device = "gkd_atom_joypad"
input_vendor_id = "1"
input_product_id = "8451"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"

input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"

input_select_btn = "8"
input_start_btn = "9"
input_menu_toggle_btn = "10"
input_l3_btn = "11"

input_up_btn = "12"
input_down_btn = "13"
input_left_btn = "14"
input_right_btn = "15"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
